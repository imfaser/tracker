[project]
name = "tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.13.1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/utils"]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://mirrors.aliyun.com/pytorch-wheels/cu132"
format = "flat"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cuda" }]
torchvision = [{ index = "pytorch-cuda" }]


[dependency-groups]
dev = ["pyright>=1.1.409", "pytest>=9.0.3", "ruff>=0.15.13"]
