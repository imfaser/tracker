[project]
name = "tracker"
version = "0.1.3"
description = "SAM3 图像分割 MCP 服务器"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.13.1",
    "fastmcp>=3.0.0",
    "Pillow>=11.0.0",
    "pydantic>=2.13.4",
    "accelerate>=1.0.0",
]

[project.scripts]
sam3-tracker = "run:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sam3", "src/run"]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://mirrors.aliyun.com/pytorch-wheels/cu132"
format = "flat"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cuda" }]
torchvision = [{ index = "pytorch-cuda" }]


[dependency-groups]
dev = ["pyright>=1.1.409", "pytest>=9.0.3", "ruff>=0.15.13"]

[tool.pytest.ini_options]
markers = ["integration: 需要 GPU 和真实模型的集成测试"]
